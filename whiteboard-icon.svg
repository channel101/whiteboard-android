<svg xmlns="http://www.w3.org/2000/svg"
     width="108"
     height="108"
     viewBox="0 0 108 108">

  <!-- Background -->
  <rect width="108" height="108" fill="#6965db" />

  <!-- Rough rectangle outline — Excalidraw style -->
  <path
    d="M24,31 L83,27 L86,78 L27,82 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- Diagonal stroke -->
  <path
    d="M36,69 L73,39"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round" />

  <!-- Diamond endpoint -->
  <path
    d="M73,34 L78,39 L73,44 L68,39 Z"
    fill="#FFFFFF" />

  <!-- Filled circle endpoint -->
  <path
    d="M36,64 A5,5 0 1 1 36,74 A5,5 0 1 1 36,64 Z"
    fill="#FFFFFF" />

</svg>

